<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <title>LearnLink</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <div id="login">
    <aside class="hero" aria-hidden="true">
      <div class="hero-in">
        <p class="hero-tag">BISU Balilihan Campus</p>
        <h2>Answers from your own course modules.</h2>
        <ul>
          <li>Every answer shows the module it came from</li>
          <li>Only materials your teachers approved</li>
          <li>Runs on the campus server, even without internet</li>
        </ul>
      </div>
    </aside>
    <div class="card" id="card"></div>
  </div>
  <div id="opening" role="status" hidden></div>
  <iframe id="fr" title="LearnLink"></iframe>
  <script src="js/login.js"></script>
</body>
</html>
